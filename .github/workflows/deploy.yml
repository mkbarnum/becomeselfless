name: Deploy to S3

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3 buckets
        run: |
          aws s3 sync . s3://becomeselfless.com --exclude ".git/*" --exclude ".github/*" --exclude ".vscode/*"
          aws s3 sync . s3://becomeselfless.net --exclude ".git/*" --exclude ".github/*" --exclude ".vscode/*"
          aws s3 sync . s3://becomeselfless.org --exclude ".git/*" --exclude ".github/*" --exclude ".vscode/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id E1EUBCGR8F9C85 --paths "/*"
